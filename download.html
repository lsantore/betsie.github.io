<head>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-HWLLHMD1E9"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-HWLLHMD1E9', {
    send_page_view: true,
    cookie_flags: 'SameSite=Lax;Secure'
  });

    <meta name="robots" content="noindex, nofollow" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Betsie App...</title>
    <!-- 
        This page is designed to be blank and execute a single JavaScript function 
        immediately upon loading to redirect the user to the appropriate App Store 
        (Apple App Store or Google Play Store) based on their operating system.
    -->
    <style>
        /* Optional: Hide body content immediately to prevent flashing */
        body { opacity: 0; margin: 0; padding: 0; }
    </style>
    
    <script>
        (function () {
            function runRedirect() {
                var userAgent = navigator.userAgent || navigator.vendor || window.opera;
                var appStoreLink = "https://testflight.apple.com/join/5RtfWwJN";
                var playStoreLink = "https://forms.gle/FX1gWv5h8jjkVJo86";
                var isAndroid = /android/i.test(userAgent);
                var redirectUrl = isAndroid ? playStoreLink : appStoreLink;
                var done = false;
                function go() {
                    if (done) return;
                    done = true;
                    window.location.replace(redirectUrl);
                }
                if (typeof gtag === "function") {
                    gtag("event", "betsie_download_redirect", {
                        link_url: redirectUrl,
                        store_target: isAndroid ? "android" : "ios",
                        engagement_time_msec: 1,
                        event_callback: go,
                        event_timeout: 2000
                    });
                    window.setTimeout(go, 2500);
                } else {
                    go();
                }
            }
            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", runRedirect);
            } else {
                runRedirect();
            }
        })();
    </script>
</head>
<body>
    <!-- Fallback text for users with JavaScript disabled -->
    <p>If you are not automatically redirected, please click the appropriate link below:</p>
    <ul>
        <li><a href="https://itunes.apple.com/app/id6754762923">Download for iOS/Mac/Windows</a></li>
        <li><a href="https://play.google.com/">Download for Android</a></li>
    </ul>

    <script src="JS/ga-events.js" defer></script>
</body>
</html>
